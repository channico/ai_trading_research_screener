[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-research-screener"
version = "0.1.0"
description = "Evidence-backed research screener for liquid US equities"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Nico" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
